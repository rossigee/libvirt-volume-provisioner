---
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - forbidigo
    - forcetypeassert
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - ineffassign
    - interfacebloat
    - iotamixing
    - ireturn
    - lll
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
    - zerologlint
  disable:
    - revive  # Package name 'api' is standard for HTTP API handlers
    - gosec   # Excluding false positives not working in v2 config
  settings:
    lll:
      line-length: 120
    gosec:
      severity: medium
      confidence: medium
  exclusions:
    rules:
      - path: "_test\\.go$"
        linters:
          - gosec
          - noctx
          - revive
          - wrapcheck
      - path: "mocks"
        linters:
          - unused
      - path: "internal/auth/certificates\\.go"
        linters:
          - gosec
      - path: "internal/libvirt/pool\\.go"
        linters:
          - gosec
      - path: "internal/lvm"
        linters:
          - gosec
      - path: "internal/minio/client\\.go"
        linters:
          - gosec
      - path: "internal/storage/db_test\\.go"
        linters:
          - gosec
      - path: "internal/jobs/manager\\.go"
        linters:
          - gosec

issues:
  max-same-issues: 10
  max-issues-per-linter: 0

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.26.6'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y libvirt-dev pkg-config dpkg-dev

    - name: Extract version
      id: version
      run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Run tests
      run: CGO_ENABLED=1 GOTESTFLAGS="-count=1" make test

    - name: Build Debian package
      run: make deb DEB_VERSION=${{ steps.version.outputs.version }}

    - name: Upload deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: deb-${{ matrix.arch }}
        path: "*.deb"
        retention-days: 1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push platform image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.production
        platforms: ${{ matrix.platform }}
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ matrix.arch }}
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  docker:
    name: Create Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create and push multi-arch manifest
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        MAJOR=$(echo $VERSION | cut -d. -f1)
        MINOR=$(echo $VERSION | cut -d. -f2)
        IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

        docker buildx imagetools create \
          --tag ${IMAGE}:v${VERSION} \
          --tag ${IMAGE}:${MAJOR}.${MINOR} \
          --tag ${IMAGE}:${MAJOR} \
          --tag ${IMAGE}:latest \
          ${IMAGE}:${{ github.ref_name }}-amd64 \
          ${IMAGE}:${{ github.ref_name }}-arm64

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: deb-*
        path: dist

    - name: Extract release notes from CHANGELOG
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
        echo "$NOTES" > release_notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/**/*.deb
        body_path: release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

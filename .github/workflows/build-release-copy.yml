name: Build and Release Copy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release-copy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}  # Remove 'refs/tags/v' prefix
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libvirt-dev pkg-config dpkg-dev

    - name: Install golangci-lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.9.0
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: make test

    - name: Run linting
      run: make lint

    - name: Build Debian package
      run: make deb DEB_VERSION=${{ steps.version.outputs.version }}

    - name: Test success
      run: echo "Workflow executed successfully"